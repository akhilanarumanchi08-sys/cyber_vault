<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CYBERVAULT // NEON SKETCHPAD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #06070d;
            background-image:
                radial-gradient(circle at 75% 25%, rgba(255, 42, 133, 0.2), transparent 45%),
                radial-gradient(circle at 20% 75%, rgba(255, 230, 0, 0.15), transparent 45%);
            color: #f8fafc; font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh; padding: 20px 24px;
        }
        .wrapper { max-width: 1000px; margin: 0 auto; }
        .nav-bar {
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
            padding: 14px 22px; background: rgba(15, 17, 28, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; margin-bottom: 20px;
        }
        .brand {
            font-weight: 800; letter-spacing: 3px; font-size: 16px;
            background: linear-gradient(90deg, #ff2a85, #ffe600);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .nav-links { display: flex; gap: 10px; flex-wrap: wrap; }
        .nav-links a {
            text-decoration: none; color: #cbd5e1; font-size: 12px; font-weight: 700;
            letter-spacing: 1px; padding: 8px 16px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .nav-links a:hover, .nav-links a.active {
            background: linear-gradient(90deg, #ff2a85, #ffe600); color: #06070d; border-color: transparent;
        }
        .draw-card {
            background: rgba(14, 16, 26, 0.94); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; padding: 22px; text-align: center;
        }
        .toolbar { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
        .tool-btn {
            padding: 9px 18px; border-radius: 10px; font-weight: 700; font-size: 12px;
            cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.15); background: #0d0f1a; color: #ffffff;
        }
        .tool-btn.pink { border-color: #ff2a85; color: #ff5ca1; }
        .tool-btn.lemon { border-color: #ffe600; color: #ffe600; }
        .tool-btn.save { background: linear-gradient(90deg, #ff2a85, #ffe600); color: #06070d; border: none; }
        canvas {
            background: #05060a; border: 1px solid rgba(255, 42, 133, 0.5);
            border-radius: 14px; cursor: crosshair; max-width: 100%; box-shadow: 0 0 30px rgba(255, 42, 133, 0.2);
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <nav class="nav-bar">
            <div class="brand">CYBERVAULT // OS</div>
            <div class="nav-links">
                <a href="index.html">01. AES VAULT</a>
                <a href="cipher-game.html">02. CIPHER BREAKER GAME</a>
                <a href="stego-draw.html" class="active">03. NEON SKETCHPAD</a>
            </div>
        </nav>
        <div class="draw-card">
            <h2 style="letter-spacing: 2px; margin-bottom: 6px;">NEON NETWORK TOPOLOGY &amp; VISUAL KEYPAD</h2>
            <p style="color: #94a3b8; font-size: 12px; margin-bottom: 16px;">Sketch attack graphs, visual passkeys, or glowing cyber diagrams and export as PNG.</p>
            <div class="toolbar">
                <button type="button" class="tool-btn pink" onclick="setGlow('#ff2a85')">Radiant Pink Brush</button>
                <button type="button" class="tool-btn lemon" onclick="setGlow('#ffe600')">Electric Lemon Brush</button>
                <button type="button" class="tool-btn" onclick="clearCanvas()">Wipe Canvas</button>
                <button type="button" class="tool-btn save" onclick="downloadArt()">Export PNG</button>
            </div>
            <canvas id="neonCanvas" width="880" height="420"></canvas>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('neonCanvas');
        const ctx = canvas.getContext('2d');
        let drawing = false;
        ctx.lineWidth = 4; ctx.lineCap = 'round';
        function setGlow(color) { ctx.strokeStyle = color; ctx.shadowBlur = 14; ctx.shadowColor = color; }
        setGlow('#ff2a85');
        canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
        canvas.addEventListener('mousemove', (e) => { if (!drawing) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); });
        canvas.addEventListener('mouseup', () => { drawing = false; });
        canvas.addEventListener('mouseleave', () => { drawing = false; });
        function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
        function downloadArt() {
            const link = document.createElement('a');
            link.download = 'cybervault-sketch.png'; link.href = canvas.toDataURL(); link.click();
        }
    </script>
</body>
</html>
